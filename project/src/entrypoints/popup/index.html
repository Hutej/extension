<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>WebMorph</title>
    <style>
      body { width: 320px; font-family: sans-serif; margin: 0; padding: 12px; }
      textarea { width: 100%; height: 60px; box-sizing: border-box; margin-bottom: 8px; }
      button { padding: 6px 12px; cursor: pointer; }
      .row { display: flex; gap: 8px; margin-bottom: 8px; }
      .status { font-size: 12px; color: #555; white-space: pre-wrap; margin-bottom: 8px; }
      .settings-toggle { cursor: pointer; color: blue; text-decoration: underline; font-size: 12px; display: block; margin-bottom: 4px; }
      .settings { display: none; margin-bottom: 8px; padding: 8px; border: 1px solid #ccc; background: #f9f9f9; }
      .settings.open { display: block; }
      .settings input { width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h3>WebMorph</h3>
    <span class="settings-toggle" id="settingsToggle">Settings (API Key)</span>
    <div class="settings" id="settingsArea">
      <label for="apiKey">OpenAI API Key:</label>
      <input type="password" id="apiKey" />
      <button id="saveKeyBtn" style="margin-top: 4px; width: 100%">Save</button>
    </div>

    <textarea id="intent" placeholder="What do you want to hide?"></textarea>
    <div class="row">
      <button id="transformBtn">Transform</button>
      <button id="resetBtn">Reset</button>
    </div>
    
    <hr />
    <div id="siteStatus">
      <div class="status" id="statusText">Checking site...</div>
      <div class="row">
        <button id="toggleBtn" disabled>On / Off</button>
        <button id="removeBtn" disabled>Remove All</button>
      </div>
    </div>

    <div class="status" id="statusEl">Ready</div>
    
    <script type="module" src="./main.ts"></script>
  </body>
</html>

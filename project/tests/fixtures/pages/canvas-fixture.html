<!doctype html>
<!-- T32 fixture: an ordinary page with its OWN native canvas — the owned
     scene must paint on its own canvas and never touch this one. The body
     text color is deliberately low-contrast: the canvas accessible fallback
     must never enter the WCAG AA check (scene content, not authored text). -->
<html lang="en">
<head><title>Canvas fixture</title>
<style>body { color: #1a2c42; background: #f4f1ea; }</style>
</head>
<body>
  <h1>Canvas target</h1>
  <canvas id="site-canvas" width="64" height="32"></canvas>
  <script>
    // The page paints its own baseline pattern; the extension's owned scene
    // must leave these pixels and this backing buffer untouched.
    const c = document.getElementById('site-canvas');
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgb(90, 90, 90)';
    ctx.fillRect(0, 0, 64, 32);
  </script>
</body>
</html>
